name: Find Ingolstadt service

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Find service
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 }
            });

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            const target = page.getByText(
              'Zuzug aus dem Ausland ohne Familie',
              { exact: true }
            );

            await target.waitFor({
              state: 'visible',
              timeout: 15000
            });

            console.log('TARGET FOUND');

            // Print the HTML around the target service
            const html = await target.evaluate(el => {
              let current = el;
              let result = '';

              for (let i = 0; i < 6 && current; i++) {
                result += '\\n--- LEVEL ' + i + ' ---\\n';
                result += current.outerHTML.substring(0, 5000);
                current = current.parentElement;
              }

              return result;
            });

            console.log(html);

            await page.screenshot({
              path: 'service.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tevis-service
          path: service.png
