name: Test Ingolstadt appointment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Test TEVIS
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({ viewport: { width: 1280, height: 1000 } });

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            console.log('Opened:', await page.title());

            // Click Wohnungsänderung
            await page.getByText('Wohnungsänderung', { exact: true }).click();

            console.log('Clicked Wohnungsänderung');

            // Wait for the next options to appear
            await page.waitForTimeout(1000);

            // Check that the desired option now exists
            const option = page.getByText(
              'Zuzug aus dem Ausland ohne Familie',
              { exact: true }
            );

            await option.waitFor({ state: 'visible', timeout: 15000 });

            console.log('Found Zuzug aus dem Ausland ohne Familie');

            await page.screenshot({
              path: 'after-selection.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tevis-test
          path: after-selection.png
