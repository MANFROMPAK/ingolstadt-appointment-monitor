name: Inspect appointment step

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect appointment step
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 }
            });

            // STEP 2
            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            await page.getByText('Zuzug aus dem Ausland ohne Familie', {
              exact: true
            }).click();

            await page.waitForTimeout(500);

            await page.locator('#button-plus-246').click();

            console.log(
              'Quantity:',
              await page.locator('#input-246').inputValue()
            );

            // Click Weiter on Step 2
            const navigation = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 10000
            }).catch(() => null);

            await page.locator('#WeiterButton').click();

            // Click OK in the information popup if it appears
            const okButton = page.getByRole('button', {
              name: 'OK',
              exact: true
            });

            if (await okButton.isVisible().catch(() => false)) {
              await okButton.click();
            }

            await navigation;
            await page.waitForTimeout(3000);

            // STEP 3
            console.log('\\n===== STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            console.log('\\n===== STEP 3 BODY =====');

            const body = await page.locator('body').innerText();
            console.log(body.substring(0, 5000));

            // Find the visible "Weiter" button.
            // There are two inputs with name="select_location":
            // one hidden "Standort auswählen" and one visible "Weiter".
            const weiter = page.locator(
              'input[type="submit"][value="Weiter"]'
            );

            console.log(
              '\\nVisible Weiter buttons:',
              await weiter.count()
            );

            console.log(
              '\\nWeiter visible:',
              await weiter.isVisible().catch(() => false)
            );

            // Click the actual visible Weiter button
            const navigation3 = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 15000
            }).catch(() => null);

            await weiter.click();

            await navigation3;
            await page.waitForTimeout(3000);

            console.log('\\n===== AFTER STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            console.log('\\n===== BODY AFTER STEP 3 =====');

            const bodyAfter = await page.locator('body').innerText();
            console.log(bodyAfter.substring(0, 5000));

            await page.screenshot({
              path: 'after-location.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step
          path: after-location.png
