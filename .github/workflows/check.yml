name: Check September appointments

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check September appointments
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1280,
                height: 1000
              }
            });

            // ==========================================
            // STEP 2
            // ==========================================

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              {
                waitUntil: 'networkidle',
                timeout: 60000
              }
            );

            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            await page.locator('#button-plus-246').click();

            await page.waitForTimeout(500);

            console.log(
              'Quantity:',
              await page.locator('#input-246').inputValue()
            );

            // ==========================================
            // STEP 2 -> STEP 3
            // ==========================================

            await page.locator('#WeiterButton').click();

            // ==========================================
            // CLOSE INFORMATION POPUP
            // ==========================================

            const dialog = page.locator('#TevisDialog');

            if (await dialog.isVisible().catch(() => false)) {
              console.log('OK popup found.');

              const okInput = dialog.locator(
                'input[type="button"], input[type="submit"]'
              ).filter({
                hasValue: 'OK'
              }).first();

              if (
                await okInput.count() > 0 &&
                await okInput.isVisible().catch(() => false)
              ) {
                await okInput.click();
              } else {
                const okText = dialog.getByText('OK', {
                  exact: true
                }).first();

                if (
                  await okText.count() > 0 &&
                  await okText.isVisible().catch(() => false)
                ) {
                  await okText.click();
                }
              }

              await dialog.waitFor({
                state: 'hidden',
                timeout: 10000
              }).catch(() => {});

              console.log('OK popup closed.');
            }

            // ==========================================
            // STEP 3
            // ==========================================

            await page.locator('#WeiterButton').waitFor({
              state: 'visible',
              timeout: 30000
            });

            await page.waitForTimeout(1000);

            console.log('\n===== STEP 3 =====');
            console.log('URL:', page.url());

            // Important:
            // We intentionally do NOT try to select
            // "Standort auswählen".
            //
            // The successful flow showed that the
            // location is already available and the
            // visible Weiter button advances to Step 4.

            const weiter = page.locator(
              '#WeiterButton:visible'
            );

            if (await weiter.count() === 0) {
              throw new Error(
                'Step 3 Weiter button not found.'
              );
            }

            console.log('Step 3 Weiter found.');

            // TEVIS can leave an overlay behind.
            await weiter.click({
              force: true
            });

            // ==========================================
            // STEP 4
            // ==========================================

            await page.waitForTimeout(3000);

            console.log('\n===== STEP 4 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            if (!page.url().includes('/suggest')) {
              throw new Error(
                'Did not reach Step 4 /suggest page.'
              );
            }

            const body = await page.locator('body').innerText();

            console.log('\n===== STEP 4 BODY =====');
            console.log(body.substring(0, 12000));

            // ==========================================
            // INSPECT DATE/TIME DOM
            // ==========================================

            console.log(
              '\n===== DATE/TIME ELEMENTS ====='
            );

            const elements = await page.locator(
              'a, button, input, td, span, div'
            ).evaluateAll(els =>
              els.map(el => ({
                tag: el.tagName,
                text: (
                  el.innerText ||
                  el.value ||
                  ''
                ).trim().replace(/\s+/g, ' '),
                id: el.id || '',
                class:
                  typeof el.className === 'string'
                    ? el.className
                    : '',
                href:
                  el.getAttribute('href') || '',
                name:
                  el.getAttribute('name') || '',
                type:
                  el.getAttribute('type') || '',
                role:
                  el.getAttribute('role') || ''
              }))
              .filter(x => {
                if (!x.text) return false;

                // Dates such as:
                // Freitag, 02.10.2026
                // Montag, 05.10.2026
                const date =
                  /\b\d{1,2}\.\d{1,2}\.\d{4}\b/.test(x.text);

                // Times such as:
                // 10:20
                const time =
                  /\b\d{1,2}:\d{2}\b/.test(x.text);

                return date || time;
              })
            );

            console.log(
              JSON.stringify(elements, null, 2)
            );

            // ==========================================
            // FIND SEPTEMBER DATES
            // ==========================================

            const septemberDates =
              [...new Set(
                body.match(
                  /\b\d{1,2}\.09\.2026\b/g
                ) || []
              )];

            console.log(
              '\n===== SEPTEMBER 2026 DATES FOUND ====='
            );

            console.log(
              septemberDates.length
                ? septemberDates.join('\n')
                : 'NONE'
            );

            // ==========================================
            // FIND SEPTEMBER CONTEXT
            // ==========================================
            //
            // We print the surrounding text for every
            // September date. This lets us see exactly
            // how TEVIS represents its appointment slots.
            //

            console.log(
              '\n===== SEPTEMBER CONTEXT ====='
            );

            for (const date of septemberDates) {
              const index = body.indexOf(date);

              const start = Math.max(
                0,
                index - 300
              );

              const end = Math.min(
                body.length,
                index + 1200
              );

              console.log(
                `\n--- ${date} ---`
              );

              console.log(
                body.substring(start, end)
              );
            }

            // ==========================================
            // FIND ALL TIMES
            // ==========================================

            const allTimes =
              [...new Set(
                body.match(
                  /\b\d{1,2}:\d{2}\b/g
                ) || []
              )];

            console.log(
              '\n===== ALL TIMES FOUND ====='
            );

            console.log(
              allTimes.length
                ? allTimes.join(', ')
                : 'NONE'
            );

            // ==========================================
            // SEPTEMBER RESULT
            // ==========================================

            console.log(
              '\n=========================================='
            );

            if (septemberDates.length > 0) {
              console.log(
                '🚨 SEPTEMBER 2026 APPOINTMENT DATE FOUND'
              );

              console.log(
                'Dates:',
                septemberDates.join(', ')
              );

              console.log(
                'Times found on Step 4:',
                allTimes.join(', ')
              );

              console.log(
                '=========================================='
              );

              // Exit successfully.
              // We are ONLY detecting here.
              // Nothing is booked.
            } else {
              console.log(
                'NO SEPTEMBER 2026 APPOINTMENT FOUND'
              );

              console.log(
                '=========================================='
              );
            }

            // ==========================================
            // SCREENSHOT
            // ==========================================

            await page.screenshot({
              path: 'step4-times.png',
              fullPage: true
            });

            await browser.close();

          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step4
          path: step4-times.png
