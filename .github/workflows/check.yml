name: September appointment monitor

on:
  workflow_dispatch:

  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"

jobs:
  check-appointments:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check September appointments
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          const START_URL =
            'https://www.ingolstadt.de/tevisweb/select2?md=5';

          const TARGET_MONTH = 9;

          async function sendAlert(message) {
            if (!process.env.ALERT_WEBHOOK) {
              console.log('\nNo ALERT_WEBHOOK secret configured.');
              console.log('ALERT MESSAGE:');
              console.log(message);
              return;
            }

            try {
              const response = await fetch(
                process.env.ALERT_WEBHOOK,
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    content: message
                  })
                }
              );

              console.log(
                'Alert response:',
                response.status
              );

              if (!response.ok) {
                console.log(
                  await response.text()
                );
              }
            } catch (error) {
              console.error(
                'Could not send alert:',
                error
              );
            }
          }

          async function closeTevisDialog(page) {
            const dialog = page.locator('#TevisDialog');

            if (
              !(await dialog.isVisible().catch(() => false))
            ) {
              return;
            }

            console.log('TEVIS information popup found.');

            // Try the actual OK controls first.
            const okInput = dialog.locator(
              'input[type="button"], input[type="submit"]'
            );

            const okCount = await okInput.count();

            for (let i = 0; i < okCount; i++) {
              const input = okInput.nth(i);

              const value =
                await input.getAttribute('value');

              if (
                value &&
                value.trim().toUpperCase() === 'OK' &&
                await input.isVisible().catch(() => false)
              ) {
                await input.click({
                  force: true
                });

                console.log('OK clicked.');

                await dialog.waitFor({
                  state: 'hidden',
                  timeout: 10000
                }).catch(() => {});

                return;
              }
            }

            // Fallback: visible OK text.
            const okText = dialog.getByText(
              'OK',
              { exact: true }
            ).last();

            if (
              await okText.count() &&
              await okText.isVisible().catch(() => false)
            ) {
              await okText.click({
                force: true
              });

              console.log('OK text clicked.');

              await dialog.waitFor({
                state: 'hidden',
                timeout: 10000
              }).catch(() => {});

              return;
            }

            console.log(
              'Popup could not be closed normally.'
            );
          }

          async function main() {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1280,
                height: 1000
              }
            });

            try {
              // ==================================================
              // STEP 2
              // ==================================================

              console.log(
                '\n===== OPENING TEVIS ====='
              );

              await page.goto(
                START_URL,
                {
                  waitUntil: 'networkidle',
                  timeout: 60000
                }
              );

              console.log(
                'Initial URL:',
                page.url()
              );

              // Select the appointment.
              const wohnung = page.getByText(
                'Wohnungsänderung',
                {
                  exact: true
                }
              );

              await wohnung.waitFor({
                state: 'visible',
                timeout: 30000
              });

              await wohnung.click();

              await page.waitForTimeout(1000);

              // Increase quantity for the required appointment.
              await page.locator(
                '#button-plus-246'
              ).click();

              await page.waitForTimeout(500);

              console.log(
                'Quantity:',
                await page.locator(
                  '#input-246'
                ).inputValue()
              );

              // ==================================================
              // STEP 2 -> STEP 3
              // ==================================================

              console.log(
                '\n===== STEP 2 -> STEP 3 ====='
              );

              await page.locator(
                '#WeiterButton'
              ).click({
                force: true
              });

              // The information popup appears after this.
              await page.waitForTimeout(500);

              await closeTevisDialog(page);

              // Wait for the location page to actually appear.
              await page.waitForTimeout(1500);

              console.log(
                'After Step 2 URL:',
                page.url()
              );

              console.log(
                'After Step 2 title:',
                await page.title()
              );

              // ==================================================
              // STEP 3
              // ==================================================

              if (
                !page.url().includes('/location')
              ) {
                console.log(
                  'WARNING: URL is not /location yet.'
                );

                // Give TEVIS/AJAX another chance.
                await page.waitForTimeout(2000);
              }

              console.log(
                '\n===== STEP 3 ====='
              );

              console.log(
                'URL:',
                page.url()
              );

              console.log(
                'TITLE:',
                await page.title()
              );

              const locationWeiter =
                page.locator(
                  'input[type="submit"][value="Weiter"]'
                ).filter({
                  visible: true
                }).last();

              // Playwright's filter({visible}) is not
              // available in all versions, so use locator
              // and inspect visibility manually below.
              const allWeiter =
                page.locator(
                  'input[type="submit"][value="Weiter"]'
                );

              let visibleWeiter = null;

              const count =
                await allWeiter.count();

              console.log(
                'Weiter candidates:',
                count
              );

              for (let i = 0; i < count; i++) {
                const candidate =
                  allWeiter.nth(i);

                if (
                  await candidate.isVisible()
                    .catch(() => false)
                ) {
                  visibleWeiter = candidate;
                  break;
                }
              }

              if (!visibleWeiter) {
                throw new Error(
                  'Could not find visible Step 3 Weiter button.'
                );
              }

              console.log(
                'Step 3 Weiter found.'
              );

              // This is important:
              // force-click exactly like the successful test.
              await visibleWeiter.click({
                force: true
              });

              // ==================================================
              // STEP 4
              // ==================================================

              console.log(
                '\n===== WAITING FOR STEP 4 ====='
              );

              // Do NOT use waitForURL() here.
              // TEVIS can update the page without normal
              // Playwright navigation events.
              await page.waitForTimeout(3000);

              // Wait until the title shows Step 4.
              try {
                await page.waitForFunction(
                  () =>
                    document.title.includes(
                      'Schritt 4 von 6'
                    ),
                  null,
                  {
                    timeout: 15000
                  }
                );
              } catch {
                console.log(
                  'Step 4 title did not appear immediately.'
                );
              }

              console.log(
                '\n===== CURRENT PAGE ====='
              );

              console.log(
                'URL:',
                page.url()
              );

              console.log(
                'TITLE:',
                await page.title()
              );

              // ==================================================
              // VERIFY /suggest
              // ==================================================

              if (
                !page.url().includes('/suggest')
              ) {
                // Sometimes the page needs a little longer.
                await page.waitForTimeout(3000);
              }

              console.log(
                'Final URL:',
                page.url()
              );

              if (
                !page.url().includes('/suggest')
              ) {
                await page.screenshot({
                  path: 'failed-step4.png',
                  fullPage: true
                });

                throw new Error(
                  'Did not reach /suggest. Current URL: ' +
                  page.url()
                );
              }

              console.log(
                '\n===== STEP 4 REACHED ====='
              );

              // ==================================================
              // READ APPOINTMENT PAGE
              // ==================================================

              const body =
                await page.locator(
                  'body'
                ).innerText();

              console.log(
                '\n===== STEP 4 BODY ====='
              );

              console.log(
                body.substring(0, 12000)
              );

              // ==================================================
              // FIND SEPTEMBER DATES
              // ==================================================

              console.log(
                '\n===== SEARCHING FOR SEPTEMBER ====='
              );

              const lines =
                body
                  .split('\n')
                  .map(x => x.trim())
                  .filter(Boolean);

              const septemberDates = [];

              // German TEVIS output normally contains dates
              // such as:
              //
              // Freitag, 04.09.2026
              //
              // We search the entire page text rather than
              // depending on fragile CSS selectors.
              for (const line of lines) {
                const match = line.match(
                  /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/
                );

                if (!match) {
                  continue;
                }

                const day =
                  Number(match[1]);

                const month =
                  Number(match[2]);

                const year =
                  Number(match[3]);

                if (
                  month === TARGET_MONTH
                ) {
                  septemberDates.push({
                    day,
                    month,
                    year,
                    text: line
                  });
                }
              }

              // Remove duplicates.
              const uniqueDates =
                Array.from(
                  new Map(
                    septemberDates.map(x => [
                      `${x.day}.${x.month}.${x.year}`,
                      x
                    ])
                  ).values()
                );

              console.log(
                '\nSeptember dates found:',
                uniqueDates.length
              );

              console.log(
                JSON.stringify(
                  uniqueDates,
                  null,
                  2
                )
              );

              // ==================================================
              // FIND TIME BUTTONS / LINKS
              // ==================================================

              const candidates =
                await page.locator(
                  'button, input, a, [role="button"]'
                ).evaluateAll(els =>
                  els.map(el => ({
                    text: (
                      el.innerText ||
                      el.value ||
                      ''
                    ).trim(),

                    tag: el.tagName,

                    id: el.id,

                    name:
                      el.getAttribute('name'),

                    class:
                      typeof el.className ===
                      'string'
                        ? el.className
                        : '',

                    href:
                      el.getAttribute('href'),

                    aria:
                      el.getAttribute(
                        'aria-label'
                      ),

                    type:
                      el.getAttribute('type')
                  }))
                );

              const timeCandidates =
                candidates.filter(x =>
                  /\b\d{1,2}:\d{2}\b/.test(
                    x.text
                  )
                );

              console.log(
                '\n===== TIME CANDIDATES ====='
              );

              console.log(
                JSON.stringify(
                  timeCandidates,
                  null,
                  2
                )
              );

              // ==================================================
              // BUILD ALERT
              // ==================================================

              if (
                uniqueDates.length > 0
              ) {
                const dateText =
                  uniqueDates
                    .map(x => x.text)
                    .join('\n');

                const timeText =
                  timeCandidates.length > 0
                    ? timeCandidates
                        .map(x => x.text)
                        .join('\n')
                    : 'Time elements detected on page; see workflow log.';

                const message =
                  [
                    '🚨 SEPTEMBER APPOINTMENT FOUND',
                    '',
                    'Ingolstadt Bürgeramt',
                    'Anliegen: Zuzug aus dem Ausland ohne Familie',
                    '',
                    'September date(s):',
                    dateText,
                    '',
                    'Detected times:',
                    timeText,
                    '',
                    'URL:',
                    page.url()
                  ].join('\n');

                console.log(
                  '\n===== ALERT ====='
                );

                console.log(message);

                await sendAlert(message);
              } else {
                console.log(
                  '\nNo September appointment date found.'
                );
              }

              // ==================================================
              // SCREENSHOT
              // ==================================================

              await page.screenshot({
                path: 'step4-times.png',
                fullPage: true
              });

              console.log(
                '\n===== CHECK COMPLETE ====='
              );

            } finally {
              await browser.close();
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step4
          path: |
            step4-times.png
            failed-step4.png
          if-no-files-found: ignore
