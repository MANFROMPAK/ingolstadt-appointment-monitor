name: Test Ingolstadt appointment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Go to appointment page
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 }
            });

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            console.log('Opened:', await page.title());

            // Select Wohnungsänderung
            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            // Select Zuzug aus dem Ausland ohne Familie
            await page.locator('#button-plus-246').click();

            await page.waitForTimeout(1000);

            // Confirm that the quantity is now 1
            const quantity = await page.locator('#input-246').inputValue();

            console.log('Quantity:', quantity);

            if (quantity !== '1') {
              throw new Error(
                `Expected quantity 1, but got ${quantity}`
              );
            }

            // Continue
            await page.locator('#WeiterButton').click();

            await page.waitForLoadState('networkidle').catch(() => {});
            await page.waitForTimeout(1500);

            console.log('SUCCESS - clicked Weiter');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            await page.screenshot({
              path: 'appointment-page.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-page
          path: appointment-page.png
