name: Test Ingolstadt appointment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Test TEVIS
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 }
            });

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            console.log('Opened TEVIS');

            // Step 1: Wohnungsänderung
            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            console.log('✓ Wohnungsänderung selected');

            await page.waitForTimeout(1000);

            // Step 2: Zuzug aus dem Ausland ohne Familie
            const option = page.getByText(
              'Zuzug aus dem Ausland ohne Familie',
              { exact: true }
            );

            await option.waitFor({
              state: 'visible',
              timeout: 15000
            });

            await option.click();

            console.log('✓ Zuzug aus dem Ausland ohne Familie selected');

            await page.waitForTimeout(1000);

            // Find the quantity input associated with the selected service.
            const inputs = await page.locator('input').evaluateAll(
              els => els.map(e => ({
                type: e.type,
                value: e.value,
                name: e.name,
                id: e.id
              }))
            );

            console.log('Inputs:', JSON.stringify(inputs, null, 2));

            await page.screenshot({
              path: 'step2.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tevis-step2
          path: step2.png
