name: September appointment monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  check-appointments:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check September appointments
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          const START_URL =
            'https://www.ingolstadt.de/tevisweb/select2?md=5';

          const TARGET_MONTH = 9;
          const TARGET_YEAR = new Date().getFullYear();

          async function sendAlert(message) {
            if (!process.env.ALERT_WEBHOOK) {
              console.log('\nALERT_WEBHOOK is not configured.');
              console.log('Alert that would have been sent:');
              console.log(message);
              return;
            }

            const response = await fetch(
              process.env.ALERT_WEBHOOK,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  content: message
                })
              }
            );

            console.log(
              'Discord alert response:',
              response.status
            );

            if (!response.ok) {
              console.log(
                await response.text()
              );
            }
          }

          async function closeTevisDialog(page) {
            const dialog = page.locator('#TevisDialog');

            if (
              !(await dialog.isVisible().catch(() => false))
            ) {
              return;
            }

            console.log('TEVIS popup found.');

            const inputs = dialog.locator(
              'input[type="button"], input[type="submit"]'
            );

            for (let i = 0; i < await inputs.count(); i++) {
              const input = inputs.nth(i);

              const value =
                await input.getAttribute('value');

              if (
                value &&
                value.trim().toUpperCase() === 'OK' &&
                await input.isVisible().catch(() => false)
              ) {
                await input.click({
                  force: true
                });

                await dialog.waitFor({
                  state: 'hidden',
                  timeout: 10000
                }).catch(() => {});

                console.log('OK popup closed.');
                return;
              }
            }

            const okText = dialog.getByText(
              'OK',
              {
                exact: true
              }
            ).last();

            if (
              await okText.count() &&
              await okText.isVisible().catch(() => false)
            ) {
              await okText.click({
                force: true
              });

              await dialog.waitFor({
                state: 'hidden',
                timeout: 10000
              }).catch(() => {});

              console.log('OK popup closed.');
              return;
            }

            console.log(
              'Could not find normal OK button.'
            );
          }

          async function main() {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1280,
                height: 1000
              }
            });

            try {

              // ==================================================
              // STEP 2
              // ==================================================

              console.log(
                '\n===== STEP 2 ====='
              );

              await page.goto(
                START_URL,
                {
                  waitUntil: 'networkidle',
                  timeout: 60000
                }
              );

              const wohnung =
                page.getByText(
                  'Wohnungsänderung',
                  {
                    exact: true
                  }
                );

              await wohnung.waitFor({
                state: 'visible',
                timeout: 30000
              });

              await wohnung.click();

              await page.waitForTimeout(1000);

              await page.locator(
                '#button-plus-246'
              ).click();

              await page.waitForTimeout(500);

              console.log(
                'Quantity:',
                await page.locator(
                  '#input-246'
                ).inputValue()
              );

              // ==================================================
              // STEP 2 -> STEP 3
              // ==================================================

              console.log(
                '\n===== STEP 2 -> STEP 3 ====='
              );

              await page.locator(
                '#WeiterButton'
              ).click({
                force: true
              });

              await page.waitForTimeout(500);

              await closeTevisDialog(page);

              await page.waitForTimeout(1500);

              console.log(
                'Current URL:',
                page.url()
              );

              // ==================================================
              // STEP 3
              // ==================================================

              console.log(
                '\n===== STEP 3 ====='
              );

              const weiterButtons =
                page.locator(
                  'input[type="submit"][value="Weiter"]'
                );

              let weiter = null;

              for (
                let i = 0;
                i < await weiterButtons.count();
                i++
              ) {
                const candidate =
                  weiterButtons.nth(i);

                if (
                  await candidate.isVisible()
                    .catch(() => false)
                ) {
                  weiter = candidate;
                  break;
                }
              }

              if (!weiter) {
                throw new Error(
                  'Step 3 Weiter button not found.'
                );
              }

              console.log(
                'Step 3 Weiter found.'
              );

              // This is the same force click that
              // worked in the successful test.
              await weiter.click({
                force: true
              });

              // ==================================================
              // STEP 4
              // ==================================================

              console.log(
                '\n===== WAITING FOR STEP 4 ====='
              );

              await page.waitForTimeout(3000);

              // TEVIS does not always behave like a normal
              // browser navigation, so don't use waitForURL().
              await page.waitForFunction(
                () =>
                  window.location.pathname.includes(
                    '/suggest'
                  ) ||
                  document.title.includes(
                    'Schritt 4 von 6'
                  ),
                null,
                {
                  timeout: 20000
                }
              ).catch(() => {});

              await page.waitForTimeout(1000);

              console.log(
                'URL:',
                page.url()
              );

              console.log(
                'TITLE:',
                await page.title()
              );

              if (
                !page.url().includes('/suggest')
              ) {
                await page.screenshot({
                  path: 'failed-step4.png',
                  fullPage: true
                });

                throw new Error(
                  'Did not reach Step 4 /suggest.'
                );
              }

              console.log(
                '\n===== STEP 4 REACHED ====='
              );

              // ==================================================
              // READ PAGE
              // ==================================================

              const body =
                await page.locator(
                  'body'
                ).innerText();

              console.log(
                '\n===== STEP 4 BODY ====='
              );

              console.log(
                body.substring(0, 12000)
              );

              // ==================================================
              // PARSE DATE SECTIONS
              // ==================================================

              console.log(
                '\n===== PARSING APPOINTMENT DATES ====='
              );

              const lines =
                body
                  .split(/\r?\n/)
                  .map(line => line.trim())
                  .filter(Boolean);

              const dateRegex =
                /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/;

              const timeRegex =
                /\b([01]?\d|2[0-3]):[0-5]\d\b/;

              const dateSections = [];

              let currentDate = null;

              for (const line of lines) {

                const dateMatch =
                  line.match(dateRegex);

                if (dateMatch) {

                  const day =
                    Number(dateMatch[1]);

                  const month =
                    Number(dateMatch[2]);

                  const year =
                    Number(dateMatch[3]);

                  currentDate = {
                    day,
                    month,
                    year,
                    dateText: line,
                    times: []
                  };

                  dateSections.push(
                    currentDate
                  );

                  continue;
                }

                if (
                  currentDate &&
                  timeRegex.test(line)
                ) {
                  const matches =
                    line.match(
                      /\b(?:[01]?\d|2[0-3]):[0-5]\d\b/g
                    );

                  if (matches) {
                    for (const time of matches) {
                      if (
                        !currentDate.times.includes(
                          time
                        )
                      ) {
                        currentDate.times.push(
                          time
                        );
                      }
                    }
                  }
                }
              }

              console.log(
                JSON.stringify(
                  dateSections,
                  null,
                  2
                )
              );

              // ==================================================
              // SEPTEMBER ONLY
              // ==================================================

              const september =
                dateSections.filter(
                  date =>
                    date.month === TARGET_MONTH &&
                    date.times.length > 0
                );

              console.log(
                '\n===== SEPTEMBER RESULTS ====='
              );

              if (september.length === 0) {

                console.log(
                  'No September appointment date found.'
                );

              } else {

                console.log(
                  'SEPTEMBER APPOINTMENT FOUND!'
                );

                console.log(
                  JSON.stringify(
                    september,
                    null,
                    2
                  )
                );

                // ==================================================
                // CREATE ALERT
                // ==================================================

                const appointmentLines =
                  september.map(
                    appointment => {

                      const times =
                        appointment.times.length
                          ? appointment.times.join(
                              ', '
                            )
                          : 'Time not detected';

                      return (
                        `${appointment.dateText} — ${times}`
                      );
                    }
                  );

                const message =
                  [
                    '🚨 **SEPTEMBER APPOINTMENT AVAILABLE**',
                    '',
                    'Bürgeramt Ingolstadt',
                    'Anliegen: Zuzug aus dem Ausland ohne Familie',
                    '',
                    '**Available September appointments:**',
                    ...appointmentLines,
                    '',
                    `Checked: ${new Date().toISOString()}`,
                    '',
                    page.url()
                  ].join('\n');

                console.log(
                  '\n===== ALERT ====='
                );

                console.log(
                  message
                );

                await sendAlert(
                  message
                );
              }

              // ==================================================
              // SCREENSHOT
              // ==================================================

              await page.screenshot({
                path: 'step4-times.png',
                fullPage: true
              });

              console.log(
                '\n===== CHECK COMPLETE ====='
              );

            } finally {
              await browser.close();
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step4
          path: |
            step4-times.png
            failed-step4.png
          if-no-files-found: ignore
