name: Inspect appointment step

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect next step
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 }
            });

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            // STEP 2
            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            await page.locator('#button-plus-246').click();

            await page.waitForTimeout(500);

            console.log(
              'Quantity:',
              await page.locator('#input-246').inputValue()
            );

            // STEP 2 -> STEP 3
            const navigation = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 10000
            }).catch(() => null);

            await page.locator('#WeiterButton').click();

            await page.getByRole('button', {
              name: 'OK',
              exact: true
            }).click();

            await navigation;

            await page.waitForTimeout(3000);

            console.log('\n===== STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            const body = await page.locator('body').innerText();

            console.log('\n===== STEP 3 BODY =====');
            console.log(body.substring(0, 5000));

            // STEP 3
            // "Standort auswählen" is a SUBMIT button.
            console.log('\n===== LOCATION BUTTONS =====');

            const locationButtons = await page.locator(
              'input[name="select_location"]'
            ).evaluateAll(els =>
              els.map(el => ({
                value: el.value,
                type: el.type,
                name: el.name,
                class: el.className
              }))
            );

            console.log(
              JSON.stringify(locationButtons, null, 2)
            );

            // Click the first "Standort auswählen" button.
            const locationButton = page.locator(
              'input[name="select_location"]'
            ).first();

            const navigation2 = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 10000
            }).catch(() => null);

            await locationButton.click();

            await navigation2;

            await page.waitForTimeout(3000);

            console.log('\n===== AFTER LOCATION =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            console.log('\n===== NEXT STEP BODY =====');

            const body2 = await page.locator('body').innerText();

            console.log(body2.substring(0, 5000));

            console.log('\n===== NEXT STEP ELEMENTS =====');

            const elements = await page.locator(
              'button, input, a, select'
            ).evaluateAll(els =>
              els.map(el => ({
                text: (el.innerText || el.value || '').trim(),
                type: el.tagName,
                id: el.id,
                name: el.getAttribute('name'),
                aria: el.getAttribute('aria-label'),
                value: el.value || null
              })).filter(x =>
                x.text || x.id || x.name || x.aria
              )
            );

            console.log(
              JSON.stringify(elements, null, 2)
            );

            await page.screenshot({
              path: 'after-location.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step
          path: after-location.png
