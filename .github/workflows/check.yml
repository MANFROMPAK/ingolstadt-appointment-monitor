name: Inspect appointment step

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect appointment step
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1280,
                height: 1000
              }
            });

            // =========================
            // STEP 2
            // =========================

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              {
                waitUntil: 'networkidle',
                timeout: 60000
              }
            );

            // This was already working — keep it.
            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            await page.locator('#button-plus-246').click();

            await page.waitForTimeout(500);

            console.log(
              'Quantity:',
              await page.locator('#input-246').inputValue()
            );

            // =========================
            // CLICK STEP 2 WEITER
            // =========================

            const navigation = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 15000
            }).catch(() => null);

            await page.locator('#WeiterButton').click();

            // =========================
            // CLOSE INFORMATION POPUP
            // =========================

            const okButton = page.getByRole('button', {
              name: 'OK',
              exact: true
            });

            await okButton.waitFor({
              state: 'visible',
              timeout: 10000
            });

            console.log('OK popup found.');

            await okButton.click();

            console.log('OK popup closed.');

            await navigation;

            await page.waitForTimeout(3000);

            // =========================
            // STEP 3
            // =========================

            console.log('\\n===== STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            console.log('\\n===== STEP 3 BODY =====');

            const body = await page.locator('body').innerText();

            console.log(
              body.substring(0, 5000)
            );

            // =========================
            // FIND VISIBLE WEITER
            // =========================

            const weiter = page.locator(
              'input[type="submit"][value="Weiter"]:visible'
            );

            console.log(
              '\\nVisible Weiter count:',
              await weiter.count()
            );

            if (await weiter.count() === 0) {
              throw new Error(
                'Visible Weiter button was not found on Step 3'
              );
            }

            console.log(
              'Step 3 Weiter found.'
            );

            // =========================
            // CLICK STEP 3 WEITER
            // =========================

            const navigation3 = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 15000
            }).catch(() => null);

            await weiter.click();

            await navigation3;

            await page.waitForTimeout(3000);

            // =========================
            // NEXT STEP
            // =========================

            console.log('\\n===== AFTER STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            console.log('\\n===== NEXT STEP BODY =====');

            const nextBody = await page.locator('body').innerText();

            console.log(
              nextBody.substring(0, 5000)
            );

            // =========================
            // SCREENSHOT
            // =========================

            await page.screenshot({
              path: 'after-location.png',
              fullPage: true
            });

            await browser.close();

          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step
          path: after-location.png
