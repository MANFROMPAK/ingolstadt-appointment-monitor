name: Inspect appointment times

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect appointment times
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1280,
                height: 1000
              }
            });

            // ==========================================
            // STEP 2
            // ==========================================

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              {
                waitUntil: 'networkidle',
                timeout: 60000
              }
            );

            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            await page.locator('#button-plus-246').click();

            await page.waitForTimeout(500);

            console.log(
              'Quantity:',
              await page.locator('#input-246').inputValue()
            );

            // ==========================================
            // CLICK STEP 2 WEITER
            // ==========================================

            await page.locator('#WeiterButton').click();

            // ==========================================
            // CLOSE STEP 2 INFORMATION POPUP
            // ==========================================

            const dialog = page.locator('#TevisDialog');

            if (await dialog.isVisible().catch(() => false)) {
              console.log('OK popup found.');

              const ok = dialog.locator(
                'button, input'
              ).filter({
                hasText: 'OK'
              }).first();

              if (await ok.count() > 0 &&
                  await ok.isVisible().catch(() => false)) {
                await ok.click();
              } else {
                const okInput = dialog.locator(
                  'input[type="button"], input[type="submit"]'
                ).filter({
                  hasValue: 'OK'
                }).first();

                if (await okInput.count() > 0) {
                  await okInput.click();
                } else {
                  // Last resort: click the visible OK text
                  await dialog.getByText('OK', {
                    exact: true
                  }).click();
                }
              }

              // Wait for popup to disappear
              await dialog.waitFor({
                state: 'hidden',
                timeout: 10000
              }).catch(() => {});

              console.log('OK popup closed.');
            }

            // ==========================================
            // MAKE SURE POPUP IS GONE
            // ==========================================

            if (await dialog.isVisible().catch(() => false)) {
              console.log(
                'Popup still visible - pressing Escape.'
              );

              await page.keyboard.press('Escape');

              await page.waitForTimeout(500);
            }

            // ==========================================
            // WAIT FOR STEP 3
            // ==========================================

            await page.locator(
              '#WeiterButton'
            ).waitFor({
              state: 'visible',
              timeout: 30000
            });

            await page.waitForTimeout(1000);

            console.log('\n===== STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            const step3Body =
              await page.locator('body').innerText();

            console.log('\n===== STEP 3 BODY =====');
            console.log(
              step3Body.substring(0, 5000)
            );

            // ==========================================
            // STEP 3 WEITER
            // ==========================================

            const weiter = page.locator(
              '#WeiterButton:visible'
            );

            console.log(
              '\nVisible Weiter count:',
              await weiter.count()
            );

            if (await weiter.count() === 0) {
              throw new Error(
                'Step 3 Weiter button not found.'
              );
            }

            console.log(
              'Step 3 Weiter found.'
            );

            // Check that popup is really gone
            console.log(
              'Dialog visible:',
              await dialog.isVisible().catch(() => false)
            );

            // Click with force because TEVIS can leave
            // an invisible overlay in the DOM.
            await weiter.click({
              force: true
            });

            // ==========================================
            // WAIT FOR STEP 4
            // ==========================================

            await page.waitForTimeout(3000);

            console.log('\n===== STEP 4 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            const step4Body =
              await page.locator('body').innerText();

            console.log('\n===== STEP 4 BODY =====');
            console.log(
              step4Body.substring(0, 8000)
            );

            // ==========================================
            // FIND TIME ELEMENTS
            // ==========================================

            console.log(
              '\n===== STEP 4 TIME ELEMENTS ====='
            );

            const timeElements =
              await page.locator(
                'button, input, a, [role="button"]'
              ).evaluateAll(els =>
                els.map(el => ({
                  text: (
                    el.innerText ||
                    el.value ||
                    ''
                  ).trim(),

                  tag: el.tagName,

                  id: el.id,

                  name:
                    el.getAttribute('name'),

                  class:
                    typeof el.className === 'string'
                      ? el.className
                      : '',

                  href:
                    el.getAttribute('href'),

                  aria:
                    el.getAttribute('aria-label'),

                  type:
                    el.getAttribute('type')
                })).filter(x =>
                  /^\d{1,2}:\d{2}$/.test(
                    x.text
                  )
                )
              );

            console.log(
              JSON.stringify(
                timeElements,
                null,
                2
              )
            );

            // ==========================================
            // FIND 10:20
            // ==========================================

            console.log(
              '\n===== ELEMENTS CONTAINING 10:20 ====='
            );

            const tenTwenty =
              await page.locator(
                'text=10:20'
              ).evaluateAll(els =>
                els.map(el => ({
                  tag: el.tagName,

                  text: (
                    el.innerText ||
                    el.value ||
                    ''
                  ).trim(),

                  id: el.id,

                  class:
                    typeof el.className === 'string'
                      ? el.className
                      : '',

                  name:
                    el.getAttribute('name'),

                  href:
                    el.getAttribute('href'),

                  role:
                    el.getAttribute('role'),

                  type:
                    el.getAttribute('type')
                }))
              );

            console.log(
              JSON.stringify(
                tenTwenty,
                null,
                2
              )
            );

            // ==========================================
            // SCREENSHOT
            // ==========================================

            await page.screenshot({
              path: 'step4-times.png',
              fullPage: true
            });

            console.log(
              '\n===== INSPECTION COMPLETE ====='
            );

            await browser.close();

          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step4
          path: step4-times.png
