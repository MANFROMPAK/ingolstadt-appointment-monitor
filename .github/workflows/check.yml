name: Inspect appointment step

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect next step
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 }
            });

            // STEP 2
            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            // KEEP THE WORKING STEP 2 CODE
            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            await page.locator('#button-plus-246').click();

            await page.waitForTimeout(500);

            console.log(
              'Quantity:',
              await page.locator('#input-246').inputValue()
            );

            const navigation = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 10000
            }).catch(() => null);

            await page.locator('#WeiterButton').click();

            const okButton = page.getByRole('button', {
              name: 'OK',
              exact: true
            });

            if (await okButton.isVisible().catch(() => false)) {
              await okButton.click();
            }

            await navigation;

            await page.waitForTimeout(3000);

            // STEP 3
            console.log('\\n===== STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            console.log('\\n===== STEP 3 BODY =====');

            const body = await page.locator('body').innerText();
            console.log(body.substring(0, 5000));

            // Find the VISIBLE Weiter button.
            // There are two inputs with name="select_location".
            // The first one ("Standort auswählen") is hidden.
            // We specifically select value="Weiter".
            const weiter = page.locator(
              'input[type="submit"][value="Weiter"]:visible'
            );

            console.log(
              '\\nVisible Weiter count:',
              await weiter.count()
            );

            if (await weiter.count() === 0) {
              throw new Error('Visible Weiter button was not found on Step 3');
            }

            console.log('Clicking visible Weiter...');

            const navigation3 = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 15000
            }).catch(() => null);

            await weiter.click();

            await navigation3;

            await page.waitForTimeout(3000);

            console.log('\\n===== AFTER STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            console.log('\\n===== NEXT STEP BODY =====');

            const nextBody = await page.locator('body').innerText();
            console.log(nextBody.substring(0, 5000));

            await page.screenshot({
              path: 'after-location.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step
          path: after-location.png
