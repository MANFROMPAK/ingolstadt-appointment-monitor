name: Test Ingolstadt appointment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Test TEVIS
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless: true});

            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 }
            });

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            console.log('Opened TEVIS');

            // Wohnungsänderung
            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            // Zuzug aus dem Ausland ohne Familie
            await page.getByText(
              'Zuzug aus dem Ausland ohne Familie',
              { exact: true }
            ).click();

            await page.waitForTimeout(1000);

            // Print buttons so we can identify the correct Weiter button
            const buttons = await page.locator('button, input[type="submit"], input[type="button"], a')
              .evaluateAll(els => els.map(e => ({
                text: (e.innerText || e.value || '').trim(),
                type: e.tagName,
                id: e.id,
                name: e.getAttribute('name')
              })));

            console.log('Buttons/links:', JSON.stringify(buttons, null, 2));

            await page.screenshot({
              path: 'before-continue.png',
              fullPage: true
            });

            // Look for Weiter
            const weiter = page.getByText('Weiter', { exact: true }).last();

            await weiter.waitFor({
              state: 'visible',
              timeout: 15000
            });

            await weiter.click();

            console.log('✓ Clicked Weiter');

            await page.waitForLoadState('networkidle').catch(() => {});
            await page.waitForTimeout(1500);

            console.log('New URL:', page.url());
            console.log('New title:', await page.title());

            await page.screenshot({
              path: 'appointment-page.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tevis-result
          path: |
            before-continue.png
            appointment-page.png
