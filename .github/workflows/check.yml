name: Check September appointments

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check September appointments
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1280,
                height: 1000
              }
            });

            // ==========================================
            // STEP 2
            // ==========================================

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              {
                waitUntil: 'networkidle',
                timeout: 60000
              }
            );

            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            await page.locator('#button-plus-246').click();

            await page.waitForTimeout(500);

            console.log(
              'Quantity:',
              await page.locator('#input-246').inputValue()
            );

            // ==========================================
            // STEP 2 -> STEP 3
            // ==========================================

            await page.locator('#WeiterButton').click();

            // ==========================================
            // CLOSE INFORMATION POPUP
            // ==========================================

            const dialog = page.locator('#TevisDialog');

            if (await dialog.isVisible().catch(() => false)) {
              console.log('OK popup found.');

              const okInput = dialog.locator(
                'input[type="button"], input[type="submit"]'
              ).filter({
                hasValue: 'OK'
              }).first();

              if (
                await okInput.count() > 0 &&
                await okInput.isVisible().catch(() => false)
              ) {
                await okInput.click();
              } else {
                const okButton = dialog.getByRole('button', {
                  name: 'OK',
                  exact: true
                }).first();

                if (
                  await okButton.count() > 0 &&
                  await okButton.isVisible().catch(() => false)
                ) {
                  await okButton.click();
                } else {
                  const okText = dialog.getByText('OK', {
                    exact: true
                  }).first();

                  if (await okText.count() > 0) {
                    await okText.click();
                  }
                }
              }

              await dialog.waitFor({
                state: 'hidden',
                timeout: 10000
              }).catch(() => {});

              console.log('OK popup closed.');
            }

            // ==========================================
            // WAIT FOR STEP 3
            // ==========================================

            await page.locator('#WeiterButton').waitFor({
              state: 'visible',
              timeout: 30000
            });

            await page.waitForTimeout(1000);

            console.log('\n===== STEP 3 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            // ==========================================
            // STEP 3 -> STEP 4
            //
            // IMPORTANT:
            // This is the same successful approach:
            // use the visible Weiter button and force
            // the click because TEVIS can leave an
            // overlay in the DOM.
            // ==========================================

            const weiter = page.locator(
              '#WeiterButton:visible'
            );

            console.log(
              'Visible Weiter count:',
              await weiter.count()
            );

            if (await weiter.count() === 0) {
              throw new Error(
                'Step 3 Weiter button not found.'
              );
            }

            console.log('Step 3 Weiter found.');

            // Start watching for the URL change BEFORE
            // clicking the button.
            const urlChange = page.waitForURL(
              url => url.pathname.includes('/suggest'),
              {
                timeout: 30000,
                waitUntil: 'domcontentloaded'
              }
            ).catch(() => null);

            await weiter.click({
              force: true
            });

            // Wait for navigation if it happened.
            await urlChange;

            // Give TEVIS/AJAX time to finish.
            await page.waitForTimeout(3000);

            // ==========================================
            // VERIFY STEP 4
            // ==========================================

            console.log('\n===== STEP 4 =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            if (!page.url().includes('/suggest')) {
              console.log(
                '\nStep 4 navigation did not complete normally.'
              );

              console.log(
                'Current URL:',
                page.url()
              );

              console.log(
                'Current page title:',
                await page.title()
              );

              throw new Error(
                'Did not reach Step 4 /suggest page.'
              );
            }

            // ==========================================
            // STEP 4 BODY
            // ==========================================

            const body =
              await page.locator('body').innerText();

            console.log('\n===== STEP 4 BODY =====');

            console.log(
              body.substring(0, 12000)
            );

            // ==========================================
            // FIND ALL DATES IN 2026
            // ==========================================

            const dates = [
              ...new Set(
                body.match(
                  /\b\d{1,2}\.\d{1,2}\.2026\b/g
                ) || []
              )
            ];

            console.log(
              '\n===== ALL 2026 DATES FOUND ====='
            );

            console.log(
              dates.length
                ? dates.join('\n')
                : 'NONE'
            );

            // ==========================================
            // FIND SEPTEMBER 2026 DATES
            // ==========================================

            const septemberDates = [
              ...new Set(
                body.match(
                  /\b\d{1,2}\.09\.2026\b/g
                ) || []
              )
            ];

            console.log(
              '\n===== SEPTEMBER 2026 DATES FOUND ====='
            );

            if (septemberDates.length === 0) {
              console.log('NONE');
            } else {
              console.log(
                septemberDates.join('\n')
              );
            }

            // ==========================================
            // FIND TIMES
            // ==========================================

            const allTimes = [
              ...new Set(
                body.match(
                  /\b\d{1,2}:\d{2}\b/g
                ) || []
              )
            ];

            console.log(
              '\n===== TIMES FOUND ====='
            );

            console.log(
              allTimes.length
                ? allTimes.join(', ')
                : 'NONE'
            );

            // ==========================================
            // PRINT SEPTEMBER CONTEXT
            // ==========================================

            console.log(
              '\n===== SEPTEMBER CONTEXT ====='
            );

            for (const date of septemberDates) {
              const index = body.indexOf(date);

              const start = Math.max(
                0,
                index - 300
              );

              const end = Math.min(
                body.length,
                index + 1500
              );

              console.log(
                `\n--- ${date} ---`
              );

              console.log(
                body.substring(start, end)
              );
            }

            // ==========================================
            // INSPECT ELEMENTS CONTAINING SEPTEMBER
            // ==========================================

            console.log(
              '\n===== SEPTEMBER DOM ELEMENTS ====='
            );

            const septemberElements =
              await page.locator(
                'a, button, input, td, span, div'
              ).evaluateAll(els =>
                els.map(el => ({
                  tag: el.tagName,

                  text: (
                    el.innerText ||
                    el.value ||
                    ''
                  ).trim().replace(/\s+/g, ' '),

                  id: el.id || '',

                  class:
                    typeof el.className === 'string'
                      ? el.className
                      : '',

                  href:
                    el.getAttribute('href') || '',

                  name:
                    el.getAttribute('name') || '',

                  type:
                    el.getAttribute('type') || '',

                  role:
                    el.getAttribute('role') || ''
                }))
                .filter(x =>
                  x.text.includes('.09.2026')
                )
              );

            console.log(
              JSON.stringify(
                septemberElements,
                null,
                2
              )
            );

            // ==========================================
            // RESULT
            // ==========================================

            console.log(
              '\n=========================================='
            );

            if (septemberDates.length > 0) {
              console.log(
                '🚨 SEPTEMBER 2026 APPOINTMENT FOUND'
              );

              console.log(
                'September dates:',
                septemberDates.join(', ')
              );

              console.log(
                'Times detected:',
                allTimes.join(', ')
              );
            } else {
              console.log(
                'NO SEPTEMBER 2026 APPOINTMENT FOUND'
              );
            }

            console.log(
              '=========================================='
            );

            // ==========================================
            // SCREENSHOT
            // ==========================================

            await page.screenshot({
              path: 'step4-times.png',
              fullPage: true
            });

            await browser.close();

          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step4
          path: step4-times.png
