name: Inspect appointment step

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect next step
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 }
            });

            await page.goto(
              'https://www.ingolstadt.de/tevisweb/select2?md=5',
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            await page.getByText('Wohnungsänderung', {
              exact: true
            }).click();

            await page.waitForTimeout(1000);

            await page.locator('#button-plus-246').click();

            await page.waitForTimeout(500);

            console.log(
              'Quantity:',
              await page.locator('#input-246').inputValue()
            );

            // Listen for navigation
            const navigation = page.waitForNavigation({
              waitUntil: 'networkidle',
              timeout: 10000
            }).catch(() => null);

            await page.locator('#WeiterButton').click();

            await page.getByRole('button', { name: 'OK', exact: true }).click();

            await navigation;

            // Give TEVIS/AJAX time to finish
            await page.waitForTimeout(3000);

            console.log('\\n===== AFTER CLICK =====');
            console.log('URL:', page.url());
            console.log('TITLE:', await page.title());

            console.log('\\n===== HEADINGS =====');

            const headings = await page.locator(
              'h1, h2, h3, h4, h5'
            ).allTextContents();

            console.log(
              headings.map(x => x.trim()).filter(Boolean).join('\\n')
            );

            console.log('\\n===== BUTTONS/LINKS ON STEP 3 =====');

            const elements = await page.locator('button, input, a').evaluateAll(els =>
            els.map(el => ({
            text: (el.innerText || el.value || '').trim(),
            type: el.tagName,
            id: el.id,
            name: el.getAttribute('name'),
            aria: el.getAttribute('aria-label')
            })).filter(x => x.text || x.id || x.aria)
          );

            console.log(JSON.stringify(elements, null, 2));

            await page.screenshot({
              path: 'after-weiter.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-step
          path: after-weiter.png
